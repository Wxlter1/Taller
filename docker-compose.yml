services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: smartparking-backend:latest
    container_name: smartparking-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/layout.json:/app/backend/layout.json
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: smartparking-frontend:latest
    container_name: smartparking-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  detector:
    # Reutiliza la imagen del backend (mismo código y dependencias):
    # una sola build en vez de dos idénticas.
    image: smartparking-backend:latest
    container_name: smartparking-detector
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./videos:/app/videos:ro
    environment:
      - HEADLESS=1
      - BACKEND_URL=http://backend:8000/api/parking/update
      - VIDEO_PATH=/app/videos/videoparkingubb2.mp4
      - ZONAS_PATH=/app/scripts/zonasubb2.json
    command: ["python", "/app/scripts/detector_video.py"]
